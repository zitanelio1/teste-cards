    <script>
      (function() {
        // Intercept uncaught TypeError on window.fetch setter in sandboxed iframes
        window.addEventListener('error', function(event) {
          if (event && event.message && event.message.indexOf('fetch') !== -1 && event.message.indexOf('getter') !== -1) {
            event.preventDefault();
            if (typeof event.stopImmediatePropagation === 'function') {
              event.stopImmediatePropagation();
            }
            return true;
          }
        }, true);

        try {
          var _currentFetch = window.fetch;
          Object.defineProperty(window, 'fetch', {
            get: function() {
              return _currentFetch;
            },
            set: function(newFetch) {
              _currentFetch = newFetch;
            },
            configurable: true,
            enumerable: true
          });
        } catch (err) {
          try {
            var proto = Object.getPrototypeOf(window);
            var _protoFetch = window.fetch;
            Object.defineProperty(proto, 'fetch', {
              get: function() {
                return _protoFetch;
              },
              set: function(newFetch) {
                _protoFetch = newFetch;
              },
              configurable: true,
              enumerable: true
            });
          } catch (err2) {}
        }
      })();
    </script>
